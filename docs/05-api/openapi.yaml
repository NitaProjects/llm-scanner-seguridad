openapi: 3.1.0
info:
  title: LLM Scanner Seguridad - Projects y TargetConfiguration
  version: 0.0.1
  description: Contratos de project-management (PM-01 a PM-07) y target-configuration (TC-01 a TC-12).
paths:
  /api/projects:
    post:
      operationId: createProject
      summary: Crear un proyecto
      description: >-
        Cada petición válida crea un UUID nuevo; los nombres pueden repetirse.
        El éxito se devuelve únicamente después del commit. No se garantiza idempotencia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Proyecto persistido; updatedAt es igual a createdAt.
          headers:
            Location:
              required: true
              description: Ruta relativa /api/projects/{id} del proyecto creado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: >-
            INVALID_REQUEST para cuerpo ausente, JSON mal formado, raíz distinta
            de objeto o propiedades desconocidas/generadas. VALIDATION_ERROR
            para campos ausentes, nulos, en blanco, tipos incorrectos, límites incumplidos
            o U+0000 en name o description. U+0000 produce INVALID_CHARACTER por cada
            campo afectado antes de acceder a persistencia, sin eliminarlo ni sustituirlo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidRequest:
                  value: {code: INVALID_REQUEST, message: 'La petición debe ser un objeto JSON con name y description opcional.', fieldErrors: []}
                requiredName:
                  value:
                    code: VALIDATION_ERROR
                    message: Los datos del proyecto no son válidos.
                    fieldErrors:
                      - {field: name, code: REQUIRED, message: El nombre es obligatorio.}
                invalidType:
                  value:
                    code: VALIDATION_ERROR
                    message: Los datos del proyecto no son válidos.
                    fieldErrors:
                      - {field: description, code: INVALID_TYPE, message: La descripción debe ser texto o null.}
                tooLong:
                  value:
                    code: VALIDATION_ERROR
                    message: Los datos del proyecto no son válidos.
                    fieldErrors:
                      - {field: name, code: TOO_LONG, message: El nombre admite hasta 120 caracteres.}
                invalidCharacter:
                  value:
                    code: VALIDATION_ERROR
                    message: Los datos del proyecto no son válidos.
                    fieldErrors:
                      - {field: name, code: INVALID_CHARACTER, message: El nombre no admite el carácter U+0000.}
                      - {field: description, code: INVALID_CHARACTER, message: La descripción no admite el carácter U+0000.}
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listProjects
      summary: Listar todos los proyectos
      description: >-
        Listado completo sin paginación, búsqueda ni filtros. Orden por createdAt
        descendente y, en empate, UUID canónico ascendente. No modifica fechas.
      responses:
        '200':
          description: Todos los proyectos; array vacío si no existen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              examples:
                empty:
                  value: []
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{id}:
    get:
      operationId: getProject
      summary: Consultar un proyecto por UUID
      description: Recupera los valores persistidos sin modificar las fechas.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      responses:
        '200':
          description: Proyecto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: INVALID_PROJECT_ID; se rechaza antes de consultar persistencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: {code: INVALID_PROJECT_ID, message: El identificador del proyecto debe ser un UUID válido., fieldErrors: []}
        '404':
          description: PROJECT_NOT_FOUND; UUID válido inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: {code: PROJECT_NOT_FOUND, message: El proyecto no existe., fieldErrors: []}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{projectId}/target:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: configureTarget
      summary: Crear el único target del Project
      description: >-
        TC-01/TC-02. Valida sin DNS/HTTP y confirma commit antes de 201.
        Project no se modifica. La UNIQUE garantiza una sola creación concurrente.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTargetRequest'}
      responses:
        '201':
          description: Configuración persistida con fechas UTC iguales y sin secretos.
          headers:
            Location:
              required: true
              description: Ruta relativa /api/projects/{projectId}/target.
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetConfiguration'}
        '400':
          $ref: '#/components/responses/TargetBadRequest'
        '404':
          $ref: '#/components/responses/TargetNotFound'
        '409':
          description: TARGET_ALREADY_CONFIGURED; no sobrescribe, también en concurrencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getTargetConfiguration
      summary: Consultar configuración sin descifrar ni consultar la clave
      responses:
        '200':
          description: Datos públicos; nunca secreto, máscara, ciphertext, nonce o metadatos criptográficos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetConfiguration'}
        '400':
          $ref: '#/components/responses/TargetBadRequest'
        '404':
          $ref: '#/components/responses/TargetNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateTargetConfiguration
      summary: Reemplazar target existente, sin upsert
      description: >-
        TC-03/TC-10. Conserva id/projectId/createdAt y no retrocede updatedAt.
        Omitir name/headers/timeoutMs toma null/{}/10000. secretValue omitido conserva
        la credencial solo con authConfig presente, mismo authType/headerName exacto
        y origen URL normalizado (esquema/host/puerto efectivo). Cambiar esos elementos
        exige secreto nuevo; null/vacío no conserva. NONE elimina el blob. Cambio atómico.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TargetConfigurationInput'}
      responses:
        '200':
          description: Configuración actualizada tras commit, sin secretos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetConfiguration'}
        '400':
          $ref: '#/components/responses/TargetBadRequest'
        '404':
          $ref: '#/components/responses/TargetNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    TargetConfigurationInput:
      type: object
      additionalProperties: false
      required: [url, requestTemplate, responsePath, authType]
      description: >-
        TC-04 a TC-12. JSON estricto sin coerción ni claves duplicadas/desconocidas,
        también dentro de authConfig. U+0000 se rechaza antes de normalizar, incluyendo
        claves y cadenas decodificadas, sin eliminar ni sustituir.
        Campos generados no admitidos. Constantes del MVP no persistidas.
      properties:
        name:
          type: [string, 'null']
          description: Opcional; trim exterior, máximo 120 puntos de código; blanco/null/omisión → null.
        url:
          type: string
          description: >-
            Trim, máximo 2048 puntos de código; absoluta HTTP/HTTPS, host y puerto válido,
            sin userinfo, fragmento, espacios interiores ni controles. Bloquea por defecto
            localhost/loopback/literales privados sin DNS. Excepción local/demo solo
            externa, acotada a orígenes declarados, nunca desde API ni para metadatos.
            Guardar no acredita autorización ni protección SSRF completa en ejecución.
        method: {type: string, const: POST, default: POST}
        contentType: {type: string, const: application/json, default: application/json}
        promptPlaceholder: {type: string, const: '{{PROMPT}}', default: '{{PROMPT}}'}
        requestTemplate:
          type: string
          description: >-
            Hasta 32768 bytes UTF-8, JSON objeto sin claves duplicadas y exactamente
            un {{PROMPT}} decodificado como valor completo de cadena, nunca clave/fragmento.
            No se aplica trim, sustitución ni ejecución.
        responsePath:
          type: string
          description: >-
            Trim, máximo 1024 puntos de código y 32 segmentos. Raíz $, .identifier
            ASCII [A-Za-z_][A-Za-z0-9_]*, propiedades ["cadena JSON no vacía"] e índices
            [0]..[2147483647] sin signo/ceros iniciales. Sin filtros, scripts, comodines,
            uniones, slices ni descenso recursivo. No se ejecuta extracción.
        headers:
          type: object
          maxProperties: 20
          default: {}
          propertyNames:
            maxLength: 128
            pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          additionalProperties: {type: string}
          description: >-
            No sensibles; valores hasta 4096 bytes UTF-8, total nombres/valores 16384 bytes.
            Sin controles U+0000..U+001F/U+007F, duplicados por caso ni colisiones authConfig.
            Prohibidos Authorization, Proxy-Authorization, Cookie, Set-Cookie, X-API-Key,
            API-Key, Host, Content-Length, Content-Type, Connection, Transfer-Encoding,
            TE, Trailer, Upgrade, Keep-Alive, Proxy-Connection, Forwarded y X-Forwarded-*.
        authType: {type: string, enum: [NONE, BEARER_TOKEN, API_KEY_HEADER]}
        authConfig:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TargetAuthInput'
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 60000
          default: 10000
          description: Token JSON entero; omitido → 10000 en POST/PUT; null, texto o fracción inválidos.
      allOf:
        - if:
            properties: {authType: {const: NONE}}
          then:
            properties: {authConfig: {type: 'null'}}
        - if:
            properties: {authType: {const: BEARER_TOKEN}}
          then:
            required: [authConfig]
            properties:
              authConfig:
                type: object
                not: {required: [headerName]}
        - if:
            properties: {authType: {const: API_KEY_HEADER}}
          then:
            required: [authConfig]
            properties:
              authConfig:
                type: object
                required: [headerName]
    CreateTargetRequest:
      allOf:
        - $ref: '#/components/schemas/TargetConfigurationInput'
        - if:
            properties: {authType: {enum: [BEARER_TOKEN, API_KEY_HEADER]}}
          then:
            properties:
              authConfig:
                type: object
                required: [secretValue]
    TargetAuthInput:
      type: object
      additionalProperties: false
      properties:
        headerName:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            HTTP token ASCII, solo API_KEY_HEADER; X-API-Key/API-Key válidos aquí.
            Prohibidos transporte/proxy, Authorization, Proxy-Authorization, Cookie,
            Set-Cookie y colisiones con headers ordinarios.
        secretValue:
          type: string
          writeOnly: true
          minLength: 1
          description: >-
            Máximo 8192 bytes UTF-8, no blanco ni controles, sin trim/alteración.
            Surrogates UTF-16 aislados producen 400 VALIDATION_ERROR con INVALID_CHARACTER
            para authConfig.secretValue antes de cifrar o escribir, sin reflejar el valor.
            Pares surrogate válidos se aceptan sin alterar el carácter suplementario.
            Un PUT inválido conserva configuración y credencial anteriores.
            Bearer sin espacios. Obligatorio al crear autenticado; en PUT omisión
            solo conserva bajo TC-10, null/vacío inválido. Nunca devuelto.
    TargetConfiguration:
      type: object
      additionalProperties: false
      required: [id, projectId, name, url, method, contentType, requestTemplate,
        promptPlaceholder, responsePath, headers, authType, authConfig, hasCredentials,
        timeoutMs, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        projectId: {type: string, format: uuid, readOnly: true}
        name: {type: [string, 'null'], maxLength: 120}
        url: {type: string, maxLength: 2048}
        method: {type: string, const: POST}
        contentType: {type: string, const: application/json}
        requestTemplate: {type: string}
        promptPlaceholder: {type: string, const: '{{PROMPT}}'}
        responsePath: {type: string, maxLength: 1024}
        headers:
          type: object
          additionalProperties: {type: string}
        authType: {type: string, enum: [NONE, BEARER_TOKEN, API_KEY_HEADER]}
        authConfig:
          description: Solo headerName para API_KEY_HEADER; null para otros tipos.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [headerName]
              properties:
                headerName: {type: string}
        hasCredentials: {type: boolean, readOnly: true}
        timeoutMs: {type: integer, minimum: 1000, maximum: 60000}
        createdAt: {type: string, format: date-time, pattern: 'Z$', readOnly: true, description: Instante UTC ISO 8601 con precisión de microsegundos.}
        updatedAt: {type: string, format: date-time, pattern: 'Z$', readOnly: true, description: Igual al crear y no anterior al instante previo ni a createdAt.}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: >-
        Solo name y description. Trim de espacios en blanco exteriores en ambos
        textos, sin modificar espacios interiores. Los límites se aplican después
        del trim y cuentan puntos de código Unicode, también fuera del plano básico.
        No se incluyen maxLength sobre el texto bruto porque los espacios exteriores
        no computan. name debe tener de 1 a 120 puntos de código tras trim;
        description admite hasta 2000. Descripción omitida, null, vacía o solo espacios
        se almacena como null. El nombre ausente, null o en blanco produce REQUIRED;
        un tipo incorrecto produce INVALID_TYPE y exceder el límite produce TOO_LONG.
        U+0000 en cualquiera de los dos campos produce INVALID_CHARACTER por cada
        campo afectado antes de acceder a persistencia; no se elimina ni sustituye.
        Esta exclusión no modifica el tratamiento del resto de Unicode.
      properties:
        name:
          type: string
          description: Obligatorio; de 1 a 120 puntos de código Unicode después de trim.
          examples: ['  Análisis inicial  ']
        description:
          type: [string, 'null']
          description: Opcional; hasta 2000 puntos de código Unicode después de trim.
    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUID generado por el sistema, inmutable.
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
          description: Instante UTC ISO 8601, con precisión de microsegundos.
        updatedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
          description: Igual a createdAt en creación; las lecturas no lo modifican.
      example:
        id: b33bfe85-a166-4bef-bb36-184a1c27e322
        name: Análisis inicial
        description: null
        createdAt: '2026-10-09T10:00:00Z'
        updatedAt: '2026-10-09T10:00:00Z'
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      description: Sin valores rechazados, excepciones, SQL ni información de conexión.
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, VALIDATION_ERROR, INVALID_PROJECT_ID, PROJECT_NOT_FOUND, TARGET_NOT_CONFIGURED, TARGET_ALREADY_CONFIGURED, INTERNAL_ERROR]
        message:
          type: string
          description: Explicación comprensible en español.
        fieldErrors:
          type: array
          description: Vacío salvo para VALIDATION_ERROR.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          enum: [name, description, url, method, contentType, promptPlaceholder, requestTemplate, responsePath, headers, authType, authConfig, authConfig.headerName, authConfig.secretValue, timeoutMs]
        code:
          type: string
          enum: [REQUIRED, INVALID_TYPE, TOO_LONG, INVALID_FORMAT, INVALID_CHARACTER, OUT_OF_RANGE, NOT_ALLOWED, CONFLICT]
        message:
          type: string
  responses:
    TargetBadRequest:
      description: >-
        INVALID_PROJECT_ID (UUID mal formado antes de persistencia), INVALID_REQUEST
        (estructura/claves duplicadas/desconocidas) o VALIDATION_ERROR (campos).
        Validación antes de cifrar o escribir; mensajes en español sin entrada.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    TargetNotFound:
      description: PROJECT_NOT_FOUND o TARGET_NOT_CONFIGURED; fallos técnicos nunca simulan ausencia.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InternalError:
      description: INTERNAL_ERROR; un fallo de almacenamiento nunca equivale a éxito, ausencia o listado vacío.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example: {code: INTERNAL_ERROR, message: No se ha podido completar la operación., fieldErrors: []}
