spring:
  application:
    name: llm-scanner-seguridad
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  scan:
    executor:
      # Defaults técnicos ajustables; no forman parte del contrato REST.
      core-pool-size: ${SCAN_EXECUTOR_CORE_POOL_SIZE:1}
      max-pool-size: ${SCAN_EXECUTOR_MAX_POOL_SIZE:1}
      queue-capacity: ${SCAN_EXECUTOR_QUEUE_CAPACITY:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
logging:
  level:
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
